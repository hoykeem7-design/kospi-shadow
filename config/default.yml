project:
  name: kospi_shadow_decision_coach_v5
  timezone: Asia/Seoul
  random_state: 20260731

data:
  start_date: "2010-01-04"
  cache_dir: data/cache
  target_provider: auto       # auto | krx | yahoo
  krx_index_name_candidates: ["코스피", "KOSPI"]
  yahoo_target_ticker: "^KS11"
  kis_provisional_fallback: true
  kis_market_code: "U"
  kis_index_code: "0001"
  kis_current_day_cutoff_time: "15:45"
  external_tickers:
    sp500: "^GSPC"
    nasdaq: "^IXIC"
    vix: "^VIX"
    sox: "^SOX"
    usdk_rw: "KRW=X"
  fred_series:
    us10y: "DGS10"
    us2y: "DGS2"
  request_timeout_seconds: 30
  request_retries: 4
  krx_pause_seconds: 0.10
  krx_recheck_recent_business_days: 5
  factor_cache_overlap_days: 10
  fred_cache_overlap_days: 14

model:
  target: intraday_up
  return_column: intraday_return
  horizon_sessions: 1
  min_train_sessions: 504
  outer_test_block_sessions: 63
  inner_splits: 3
  purge_gap_sessions: 1
  candidate_profile: compact
  probability_trade_threshold: 0.57
  transaction_cost_bps_per_side: 5.0
  max_feature_staleness_days: 7
  max_model_age_days: 8

promotion:
  min_oos_sessions: 252
  min_brier_improvement: 0.0025
  bootstrap_iterations: 500
  min_bootstrap_win_probability: 0.80
  require_official_target: true
  require_cost_adjusted_positive_return: true
  require_sharpe_above_long_baseline: true
  max_data_age_calendar_days: 7

coach:
  news_query: "코스피 OR 증시 OR 환율 OR 금리 OR 반도체"
  news_limit: 12
  event_horizon_days: 7
  market_attention_limit: 20
  weather:
    label: 서울
    latitude: 37.5665
    longitude: 126.9780

# Presentation/ranking controls, not validated trading rules. Observation
# scores sort received evidence and must never be displayed as probabilities.
decision_coach:
  maximum_watch_candidates: 5
  maximum_entry_candidates: 3
  maximum_next_day_candidates: 5
  maximum_news_items: 20
  ranking_completeness_weight: 0.70
  ranking_directional_weight: 0.30
  news_fresh_minutes: 120
  news_recent_minutes: 720
  news_duplicate_window_minutes: 360
  minimum_data_completeness: 0.75
  paper_fee_bps_per_side: 5.0
  paper_slippage_bps_per_side: 5.0
  maximum_decision_records_per_symbol: 5000
  intraday_review_times: ["09:30", "10:30", "12:00", "14:30", "15:20"]
  coach_deploy_times: ["07:30", "08:00", "08:50", "09:05", "12:00", "15:20", "15:35", "15:45", "18:00", "20:05"]
  collector_times: ["08:12", "08:22", "08:32", "08:42", "08:50", "08:55", "09:00", "09:05", "09:30", "15:42", "17:00", "19:00", "20:00"]
  kospi_market_gate:
    trade_ok_probability: 0.57
    selective_probability: 0.54
    risk_off_probability: 0.43
    maximum_ledger_records: 5000
  # Observation-only theme discovery. These are presentation and safety
  # heuristics, not validated probabilities or trading-rule weights.
  theme_supply_radar:
    mode: shadow_only
    maximum_themes: 3
    maximum_members_per_theme: 3
    minimum_theme_members: 2
    minimum_breadth_ratio: 0.60
    maximum_nxt_return_before_chase_review: 0.08
    maximum_opening_return_before_chase_review: 0.05
    weather_heat_threshold_c: 30.0
    maximum_ledger_records: 5000
    validation_horizons_minutes: [5, 15, 30]
    # Explicit observation map only. A mapped symbol is shown only when it is
    # actually received through PREMARKET_SYMBOLS or the live KIS rank slice.
    themes:
      - key: semiconductor_ai
        symbols: ["005930", "000660", "042700"]
      - key: secondary_battery
        symbols: ["373220", "006400", "051910"]
      - key: cooling_weather
        symbols: ["002700", "009450"]
      - key: defense
        symbols: ["012450", "047810", "079550"]
      - key: shipbuilding
        symbols: ["329180", "009540", "010140"]
      - key: nuclear_power
        symbols: ["034020", "267260", "010120"]
      - key: bio_health
        symbols: ["207940", "068270", "326030"]
  signal_gate:
    require_walk_forward_validation: true
    require_no_future_leakage: true
    require_brier_improvement: true
    require_calibration: true
    require_positive_cost_adjusted_return: true

# Individual-stock NXT experiment. An empty list is intentional: production
# never invents a watchlist. Configure six/seven-character domestic symbols
# here or through the non-secret PREMARKET_SYMBOLS repository variable.
premarket:
  symbols: []
  nxt_observation_start: "08:00"
  nxt_observation_end: "08:50"
  opening_auction_observation_start: "08:55"
  opening_auction_observation_end: "09:00"
  first_confirmation_time: "09:05"
  gap_continuation_time: "09:30"
  baseline_sessions: 20
  minimum_baseline_samples: 20
  same_time_tolerance_minutes: 5
  minimum_volume: 0
  minimum_turnover: 0
  minimum_model_samples: 252
  stale_after_seconds: 180
  minimum_gap_price_unit: 0.0
  backtest_transaction_cost_bps_per_side: 5.0
  backtest_slippage_bps_per_side: 5.0
  outlier_iqr_multiplier: 5.0
  # Raw snapshots and normalized training records are separate. The default
  # raw capacity exceeds five years at roughly ten snapshots per trading day;
  # training storage keeps at most two normalized stage records per day.
  history_dir: data/premarket_history
  maximum_raw_history_records_per_symbol: 25000
  maximum_training_records_per_symbol: 5000
  signal_strength_thresholds: null  # unavailable until calibrated on validation data

name: KOSPI Shadow Coach App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/coach-app.yml"
  schedule:
    - cron: "30 7 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "0 8 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "50 8 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "5 9 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "0 12 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "20 15 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "35 15 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "45 15 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "0 18 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "5 20 * * 1-5"
      timezone: "Asia/Seoul"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kospi-shadow-live-data
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PREMARKET_SYMBOLS: ${{ vars.PREMARKET_SYMBOLS }}
      PREMARKET_HISTORY_DIR: premarket-history-store/history
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out durable history workspace
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: premarket-history-store
          fetch-depth: 0
      - name: Prepare durable history branch
        shell: bash
        run: bash scripts/prepare_premarket_history.sh premarket-history-store history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore market data
        uses: actions/cache@v4
        with:
          path: data/cache
          key: market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-data-${{ runner.os }}-
      - name: Restore trained state
        uses: actions/cache@v4
        with:
          path: state
          key: model-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            model-state-${{ runner.os }}-
      - name: Restore coach history
        uses: actions/cache@v4
        with:
          path: app_state
          key: coach-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            coach-history-${{ runner.os }}-
      - name: Verify data and deployment secrets
        shell: bash
        run: |
          test -n "$KRX_AUTH_KEY" || { echo "KRX_AUTH_KEY is missing"; exit 2; }
          test -n "$FRED_API_KEY" || { echo "FRED_API_KEY is missing"; exit 2; }
          test -n "$KIS_APP_KEY" || { echo "KIS_APP_KEY is missing"; exit 2; }
          test -n "$KIS_APP_SECRET" || { echo "KIS_APP_SECRET is missing"; exit 2; }
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "NETLIFY_AUTH_TOKEN is missing"; exit 2; }
          test -n "$NETLIFY_SITE_ID" || { echo "NETLIFY_SITE_ID is missing"; exit 2; }
      - run: pip install .
      - name: Refresh prediction and build session-aware PWA
        run: kospi-shadow-coach --refresh-prediction --config config/default.yml --project-root .
      - name: Persist normalized and raw premarket history
        shell: bash
        run: |
          git -C premarket-history-store config user.name "github-actions[bot]"
          git -C premarket-history-store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C premarket-history-store add history
          if ! git -C premarket-history-store diff --cached --quiet; then
            git -C premarket-history-store commit -m "Store premarket history for run $GITHUB_RUN_ID"
            git -C premarket-history-store push origin HEAD:premarket-history
          fi
      - name: Validate deploy directory
        shell: bash
        run: |
          test -f site/index.html
          test -f site/app.js
          test -f site/sw.js
          test -f site/data/dashboard.json
          test -f site/_headers
          node --check site/app.js
          node --check site/sw.js
      - name: Publish summary
        shell: bash
        run: |
          {
            cat outputs/daily_brief.md
            echo ""
            echo "Coach PWA generated and queued for Netlify production deployment."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable app artifact
        uses: actions/upload-artifact@v4
        with:
          name: kospi-shadow-coach-${{ github.run_number }}
          path: site/
          if-no-files-found: error
          retention-days: 30
      - name: Deploy latest dashboard to Netlify production
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --no-build \
            --dir=site \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="KOSPI Coach run $GITHUB_RUN_NUMBER ($GITHUB_SHA)" \
            --timeout=10m \
            --json | tee outputs/netlify-deploy.json
      - name: Record Netlify deployment
        if: always()
        shell: bash
        run: |
          if [ -s outputs/netlify-deploy.json ]; then
            {
              echo ""
              echo "## Netlify deployment"
              echo '```json'
              cat outputs/netlify-deploy.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Pages artifact
        if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy-pages:
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy app to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy KOSPI App to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy-github-pages-via-pr.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kospi-shadow-github-pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PRODUCTION_URL: https://joyful-crostata-e96663.netlify.app
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Pages package with latest app shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site outputs
          mkdir -p site/data outputs
          cp -R app/. site/
          touch site/.nojekyll

          curl --fail --silent --show-error \
            --retry 4 --retry-delay 3 \
            -H "Cache-Control: no-cache" \
            "$PRODUCTION_URL/data/dashboard.json?source_sha=$EXPECTED_SHA" \
            -o outputs/production-dashboard.json
          curl --fail --silent --show-error \
            --retry 2 --retry-delay 2 \
            -H "Cache-Control: no-cache" \
            "$PRODUCTION_URL/data/history.json?source_sha=$EXPECTED_SHA" \
            -o site/data/history.json \
            || printf '[]\n' > site/data/history.json

          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          dashboard = json.loads(Path("outputs/production-dashboard.json").read_text(encoding="utf-8"))
          previous_generated_at = dashboard.get("generated_at_seoul")
          dashboard["app_version"] = "5.3.1"
          dashboard["build_sha"] = os.environ["EXPECTED_SHA"]
          dashboard["app_shell_deployment"] = {
              "mode": "github_pages_fallback",
              "updated_at_seoul": datetime.now(ZoneInfo("Asia/Seoul")).isoformat(),
              "source_generated_at_seoul": previous_generated_at,
              "source": "last_successful_netlify_snapshot",
          }
          quality = dashboard.setdefault("data_quality", {})
          warnings = list(quality.get("warnings") or [])
          notice = "GitHub Pages 대체 배포본입니다. 시장 데이터는 마지막 정상 Netlify 스냅샷을 유지합니다."
          if notice not in warnings:
              warnings.append(notice)
          quality["warnings"] = warnings
          Path("site/data/dashboard.json").write_text(
              json.dumps(dashboard, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          escaped = json.dumps(dashboard, ensure_ascii=False).replace("</", "<\\/")
          Path("site/data/initial-data.js").write_text(
              f"window.__INITIAL_DASHBOARD__ = {escaped};\n", encoding="utf-8"
          )
          PY

          node --check site/app.js
          node --check site/sw.js
          grep -q "v5.3.1" site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify GitHub Pages output
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          verified=0
          for attempt in $(seq 1 24); do
            curl --fail --silent --show-error -H "Cache-Control: no-cache" \
              "${PAGE_URL}index.html?sha=$EXPECTED_SHA&attempt=$attempt" -o outputs/pages-index.html || true
            curl --fail --silent --show-error -H "Cache-Control: no-cache" \
              "${PAGE_URL}data/dashboard.json?sha=$EXPECTED_SHA&attempt=$attempt" -o outputs/pages-dashboard.json || true
            if grep -q "v5.3.1" outputs/pages-index.html 2>/dev/null; then
              LIVE_SHA=$(python -c 'import json; print(json.load(open("outputs/pages-dashboard.json", encoding="utf-8")).get("build_sha") or "")' 2>/dev/null || true)
              if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
                verified=1
                break
              fi
            fi
            sleep 5
          done
          test "$verified" -eq 1

      - name: Record deployment result
        if: always()
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p deployments
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "status": os.environ.get("JOB_STATUS"),
              "commit_sha": os.environ.get("EXPECTED_SHA"),
              "page_url": os.environ.get("PAGE_URL"),
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "expected_app_version": "5.3.1",
          }
          Path("deployments/github-pages-latest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/github-pages-latest.json
          git commit -m "Record GitHub Pages deployment result" || exit 0
          git push origin HEAD:main

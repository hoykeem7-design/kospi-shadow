name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - name: Run Python tests
        run: PYTHONPATH=src pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Parse workflow YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path('.github/workflows').glob('*.yml')) + sorted(Path('.github/workflows').glob('*.yaml'))
          for path in files:
              yaml.safe_load(path.read_text(encoding='utf-8'))
          print(f'PyYAML PASS: {len(files)} workflow files')
          PY
      - name: Check PWA JavaScript syntax
        run: |
          node --check app/app.js
          node --check app/operational-trust.js
          node --check app/sw.js
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

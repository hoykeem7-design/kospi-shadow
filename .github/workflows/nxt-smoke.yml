name: NXT Stock Live Data Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/kospi_shadow/premarket*.py"
      - "config/default.yml"
      - ".github/workflows/nxt-smoke.yml"

permissions:
  contents: read

concurrency:
  group: kospi-shadow-live-data
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      PREMARKET_SYMBOLS: ${{ vars.PREMARKET_SYMBOLS }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify provider credentials
        shell: bash
        run: |
          test -n "$KIS_APP_KEY" || { echo "KIS_APP_KEY is missing"; exit 2; }
          test -n "$KIS_APP_SECRET" || { echo "KIS_APP_SECRET is missing"; exit 2; }
      - run: pip install .
      - name: Verify configured NXT symbols against live KIS data
        run: kospi-shadow-premarket --config config/default.yml --project-root . --smoke
      - name: Publish non-secret smoke counts
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("outputs/premarket_collection_status.json")
          status = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("## NXT live-data smoke test\n\n")
              handle.write(f"- Configured symbols: {status.get('configured_symbol_count', 0)}\n")
              handle.write(f"- Available symbols: {status.get('available_symbol_count', 0)}\n")
              handle.write(f"- Availability: {status.get('data_availability', 'unavailable')}\n")
          PY
      - name: Upload non-secret smoke status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxt-live-smoke-${{ github.run_number }}
          path: outputs/premarket_collection_status.json
          if-no-files-found: warn
          retention-days: 14

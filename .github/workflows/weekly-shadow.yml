name: Weekly KOSPI Shadow Retrain

on:
  workflow_dispatch:
  schedule:
    # Saturday 09:10 Asia/Seoul: full validation and model-state refresh.
    - cron: "10 9 * * 6"
      timezone: "Asia/Seoul"

permissions:
  contents: read

concurrency:
  group: kospi-shadow-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-data-${{ runner.os }}-
      - name: Restore previous trained state
        uses: actions/cache@v4
        with:
          path: state
          key: model-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            model-state-${{ runner.os }}-
      - run: pip install .
      - name: Full leakage-controlled validation and refit
        shell: bash
        run: |
          rm -rf outputs
          mkdir -p outputs
          set -o pipefail
          kospi-shadow --mode full --config config/default.yml --project-root . 2>&1 | tee outputs/run.log
      - name: Publish GitHub job summary
        if: always()
        shell: bash
        run: |
          if [ -f outputs/daily_brief.md ]; then cat outputs/daily_brief.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload full audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kospi-shadow-weekly-${{ github.run_number }}
          path: outputs/
          if-no-files-found: error
          retention-days: 180

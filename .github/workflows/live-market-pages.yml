name: KOSPI Fast Live Market Refresh

on:
  workflow_dispatch:
  schedule:
    # 08:00-08:50 KST, Monday-Friday
    - cron: "*/10 23 * * 0-4"
    # 09:00-15:50 KST, Monday-Friday
    - cron: "*/10 0-6 * * 1-5"
    # 16:00-20:40 KST, Monday-Friday
    - cron: "*/20 7-11 * * 1-5"
    # Market Gate checkpoints outside the 10/20-minute cadence.
    - cron: "5 0 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "5 11 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kospi-shadow-fast-pages
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    # Pages deployment must not race the full Coach deployment.
    concurrency:
      group: kospi-shadow-pages-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      PREMARKET_SYMBOLS: ${{ vars.PREMARKET_SYMBOLS }}
      PAGE_URL: https://hoykeem7-design.github.io/kospi-shadow/
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify KIS credentials
        shell: bash
        run: |
          test -n "$KIS_APP_KEY" || { echo "KIS_APP_KEY is missing"; exit 23; }
          test -n "$KIS_APP_SECRET" || { echo "KIS_APP_SECRET is missing"; exit 24; }

      - run: pip install .

      - name: Build current KIS market snapshot
        shell: bash
        run: python scripts/fast_live_market.py

      - name: Validate Pages package
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/app.js
          test -f site/operational-trust.js
          test -f site/runtime-state-fix.js
          test -f site/sw.js
          test -f site/data/dashboard.json
          node --check site/app.js
          node --check site/operational-trust.js
          node --check site/runtime-state-fix.js
          node --check site/sw.js
          touch site/.nojekyll
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          dashboard = json.loads(Path("site/data/dashboard.json").read_text(encoding="utf-8"))
          if dashboard.get("build_sha") != os.environ["GITHUB_SHA"]:
              raise SystemExit("dashboard build SHA mismatch")
          if dashboard.get("app_version") != "5.5.0":
              raise SystemExit(f"unexpected app version: {dashboard.get('app_version')}")
          trust = dashboard.get("operational_trust") or {}
          if trust.get("market_stale_after_minutes") != 15:
              raise SystemExit("v5.5 operational trust policy is missing")
          market = dashboard.get("market") or {}
          if not market.get("kospi") and not market.get("kospi200_futures"):
              raise SystemExit("KIS market snapshot is empty")
          print("GENERATED_AT_SEOUL=" + str(dashboard.get("generated_at_seoul")))
          print("APP_VERSION=" + str(dashboard.get("app_version")))
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

      - name: Deploy current KIS market data
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live market deployment
        shell: bash
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          verified=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
                -H "Cache-Control: no-cache" \
                "${DEPLOYED_URL}data/dashboard.json?sha=$GITHUB_SHA&attempt=$attempt" \
                -o /tmp/live-dashboard.json; then
              readarray -t LIVE_VALUES < <(python - <<'PY'
          import json
          payload = json.load(open("/tmp/live-dashboard.json", encoding="utf-8"))
          print(payload.get("build_sha") or "")
          print(payload.get("app_version") or "")
          print((payload.get("operational_trust") or {}).get("market_stale_after_minutes") or "")
          PY
              )
              if [ "${LIVE_VALUES[0]}" = "$GITHUB_SHA" ] \
                && [ "${LIVE_VALUES[1]}" = "5.5.0" ] \
                && [ "${LIVE_VALUES[2]}" = "15" ]; then
                verified=1
                break
              fi
            fi
            sleep 5
          done
          test "$verified" -eq 1

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          clean: false

      - name: Record verified fast market deployment
        shell: bash
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          mkdir -p deployments
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          live = json.loads(Path("/tmp/live-dashboard.json").read_text(encoding="utf-8"))
          market = live.get("market") or {}
          status = {
              "status": "success",
              "mode": "fast_live_market_only",
              "commit_sha": os.environ["GITHUB_SHA"],
              "page_url": os.environ["DEPLOYED_URL"],
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "app_version": live.get("app_version"),
              "generated_at_seoul": live.get("generated_at_seoul"),
              "kospi": market.get("kospi"),
              "kospi200_futures": market.get("kospi200_futures"),
              "stock_attention_availability": (market.get("stock_attention") or {}).get("availability"),
              "model_snapshot_reused": True,
              "operational_trust": live.get("operational_trust"),
          }
          Path("deployments/fast-market-latest.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/fast-market-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record fast KIS market deployment $GITHUB_SHA"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

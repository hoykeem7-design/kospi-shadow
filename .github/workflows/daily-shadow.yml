name: Daily KOSPI Shadow

on:
  workflow_dispatch:
  schedule:
    # 08:05 Asia/Seoul on weekdays. Auto mode predicts from cached weekly state.
    - cron: "5 8 * * 1-5"
      timezone: "Asia/Seoul"

permissions:
  contents: read

concurrency:
  group: kospi-shadow-daily
  cancel-in-progress: true

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore market-data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: market-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            market-data-${{ runner.os }}-
      - name: Restore trained-state cache
        uses: actions/cache@v4
        with:
          path: state
          key: model-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            model-state-${{ runner.os }}-
      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$KRX_AUTH_KEY" || { echo "KRX_AUTH_KEY is missing"; exit 2; }
          test -n "$FRED_API_KEY" || { echo "FRED_API_KEY is missing"; exit 2; }
      - run: pip install .
      - name: Record environment
        run: |
          rm -rf outputs
          mkdir -p outputs
          python --version > outputs/environment.txt
          pip freeze >> outputs/environment.txt
      - name: Refresh data and generate next-session prediction
        shell: bash
        run: |
          set -o pipefail
          kospi-shadow --mode auto --config config/default.yml --project-root . 2>&1 | tee outputs/run.log
      - name: Publish GitHub job summary
        if: always()
        shell: bash
        run: |
          if [ -f outputs/daily_brief.md ]; then cat outputs/daily_brief.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload auditable outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kospi-shadow-${{ github.run_number }}
          path: outputs/
          if-no-files-found: error
          retention-days: 90

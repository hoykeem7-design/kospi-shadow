[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kospi-shadow"
version = "5.0.0"
description = "Leakage-controlled KOSPI forecast and time-based decision coaching PWA"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "yfinance>=0.2.65,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
kospi-shadow = "kospi_shadow.cli:main"
kospi-shadow-coach = "kospi_shadow.coach_cli:main"
kospi-shadow-premarket = "kospi_shadow.premarket_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
